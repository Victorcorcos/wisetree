[package]
name = "wisetree"
version = "1.0.0"
edition = "2021"
rust-version = "1.78"
description = "Interactive CLI for creating and managing Git worktrees"
license = "MIT"
repository = "https://github.com/victorcorcos/wisetree"
keywords = ["git", "worktree", "cli", "tui"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
default-run = "wisetree"

[[bin]]
name = "wisetree"
path = "src/main.rs"

[[bin]]
name = "generate-schema"
path = "src/bin/generate_schema.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dirs = "5.0"
globset = "0.4"
once_cell = "1.20"
ratatui = "0.29"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util", "fs", "signal"] }
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
insta = "1.41"
predicates = "3.1"
tempfile = "3.14"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"

# cargo-dist configuration. Run `cargo dist init` to (re)generate the
# release workflow under `.github/workflows/release.yml`. Targets cover
# the same matrix as branchlet's npm distribution. The `npm` installer
# emits a main package with `optionalDependencies` on the platform
# packages, so `npm install -g wisetree` resolves to the right binary.
[workspace.metadata.dist]
cargo-dist-version = "0.23.0"
ci = ["github"]
installers = ["shell", "powershell", "npm", "homebrew"]
tap = "victorcorcos/homebrew-tap"
publish-jobs = ["homebrew", "npm"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
pr-run-mode = "plan"
hosting = ["github"]
npm-package = "wisetree"
install-updater = false
