[package]
name = "wisetree"
version = "1.0.0"
edition = "2021"
rust-version = "1.78"
description = "Interactive CLI for creating and managing Git worktrees"
license = "MIT"
repository = "https://github.com/victorcorcos/wisetree"
homepage = "https://github.com/victorcorcos/wisetree"
keywords = ["git", "worktree", "cli", "tui"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
default-run = "wisetree"

[[bin]]
name = "wisetree"
path = "src/main.rs"

[[bin]]
name = "generate-schema"
path = "src/bin/generate_schema.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dirs = "5.0"
globset = "0.4"
once_cell = "1.20"
ratatui = "0.29"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util", "fs", "signal"] }
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
insta = "1.41"
predicates = "3.1"
tempfile = "3.14"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'cargo dist'
[workspace.metadata.dist]
# The preferred cargo-dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.23.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "victorcorcos/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew", "npm"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Where to host releases
hosting = "github"
# The npm package should have this name
npm-package = "wisetree"
# Whether to install an updater program
install-updater = false
# Path that installers should place binaries in
install-path = "CARGO_HOME"
